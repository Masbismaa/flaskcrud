{% extends "base.html" %}

{% block title %}
Lupa Password
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth/fpass.css') }}">
{% endblock %}

{% block content %}

<div class="liquid-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
</div>

<div class="fp-container">
    <div class="fp-card">

        <div class="fp-icon">
            🔑
        </div>

        <h1>Lupa Password?</h1>
        <p>Tenang, selama masih ada akses, aman kok itu Akun ✨</p>

        <form method="POST">

            <div class="form-group floating">
                <input
                    type="email"
                    name="email"
                    id="fpEmail"
                    placeholder=" "
                >
                <label for="fpEmail">Email</label>
            </div>

            <div class="fp-divider">
                <span>atau</span>
            </div>

            <div class="form-group floating">
                <input
                    type="text"
                    name="phone"
                    id="fpPhone"
                    placeholder=" "
                >
                <label for="fpPhone">Nomor WhatsApp</label>
            </div>

            <button type="submit" class="btn">
                Lanjutkan →
            </button>

        </form>

        <a href="{{ url_for('auth.login') }}" class="fp-back">
            ← Kembali ke Login
        </a>

    </div>
</div>

{% block scripts %}
<script src="{{ url_for('static', filename='js/login.js') }}"></script>
{% endblock %}

{% endblock %}
