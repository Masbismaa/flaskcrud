{% extends "base.html" %}

{% block title %}
Lupa Password
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth/fpass.css') }}">
{% endblock %}

{% block content %}

<div class="fp-container">
    <div class="fp-card">

        <div class="fp-icon">
            🔑
        </div>

        <h1>Lupa Password?</h1>
        <p>Tenang, selama masih ada akses, aman kok itu Akun ✨</p>

        <form method="POST">

            <div class="form-group">
                <label>Email</label>
                <input
                    type="email"
                    name="email"
                    placeholder="contoh@email.com"
                >
            </div>

            <div class="fp-divider">
                <span>atau</span>
            </div>

            <div class="form-group">
                <label>Nomor WhatsApp</label>
                <input
                    type="text"
                    name="phone"
                    placeholder="08xxxxxxxxxx"
                >
            </div>

            <button type="submit" class="btn">
                Lanjutkan →
            </button>

        </form>

        <a href="{{ url_for('auth.login') }}" class="fp-back">
            ← Kembali ke Login
        </a>

    </div>
</div>

{% endblock %}
