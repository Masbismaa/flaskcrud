{% extends "base.html" %}

{% block content %}

<h1>Lupa Password</h1>

<p>
    Masukkan email atau nomor WhatsApp yang terdaftar.
</p>

<form method="POST">

    <div>
        <label>Email</label>
        <input
            type="email"
            name="email"
            placeholder="contoh@email.com"
        >
    </div>

    <div>
        <label>Nomor WhatsApp</label>
        <input
            type="text"
            name="phone"
            placeholder="08xxxxxxxxxx"
        >
    </div>

    <button type="submit">
        Lanjutkan
    </button>

</form>

<p>
    <a href="{{ url_for('auth.login') }}">
        Kembali ke Login
    </a>
</p>

{% endblock %}
