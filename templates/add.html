{% extends "base.html" %}

{% block title %}
Tambah Produk
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/form.css') }}">
{% endblock %}

{% block content %}

<div class="form-page">
    <div class="form-card">

        <div class="header">
            <div>
                <h1>Tambah Produk</h1>
                <p>Isi data produk baru di bawah ini.</p>
            </div>
        </div>

        <form method="POST">
            <div class="form-group">
                <label>Nama Produk</label>
                <input type="text" name="name" placeholder="Contoh: Indomie" required>
            </div>

            <div class="form-group">
                <label>Harga</label>
                <input type="number" name="price" min="0" placeholder="Contoh: 3500" required>
            </div>

            <div class="form-group">
                <label>Stock</label>
                <input type="number" name="stock" min="0" placeholder="Contoh: 20" required>
            </div>

            <div class="form-group">
                <label>Kategori</label>
                <select name="category_id" required>
                    <option value="">Pilih Kategori</option>
                    {% for category in categories %}
                    <option value="{{ category.id }}">{{ category.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit" class="btn">Simpan</button>
        </form>
    </div>
</div>
{% endblock %}
