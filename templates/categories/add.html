{% extends "base.html" %}

{% block title %}
Tambah Kategori
{% endblock %}

{% block content %}

<h1>Tambah Kategori</h1>

<form method="POST">

    <div>

        <label>
            Nama Kategori
        </label>

        <input
            type="text"
            name="name"
            placeholder="Contoh: Elektronik"
            required
        >

    </div>

    <button type="submit">
        Simpan
    </button>

</form>

{% endblock %}
