{% extends "base.html" %}

{% block title %}
Edit Kategori
{% endblock %}

{% block content %}

<h1>Edit Kategori</h1>

<form
    method="POST"
    action="{{ url_for('category.edit_category', id=category.id) }}"
>

    <div>

        <label>
            Nama Kategori
        </label>

        <input
            type="text"
            name="name"
            value="{{ category.name }}"
            required
        >

    </div>

    <button type="submit">
        Simpan Perubahan
    </button>

</form>

{% endblock %}
