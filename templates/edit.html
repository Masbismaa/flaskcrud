{% extends "base.html" %}

{% block title %}
Edit Produk
{% endblock %}

{% block content %}

<h1>Edit Produk</h1>

<form
    method="POST"
    action="{{ url_for('product.edit_product', id=product.id) }}">
    <div>
        <label>Nama Produk</label>
        <input
            type="text"
            name="name"
            value="{{ product.name }}"
            required
        >
    </div>

    <div>
        <label>Harga</label>
        <input
            type="number"
            name="price"
            value="{{ product.price }}"
            min="0"
            required
        >
    </div>

    <div>
        <label>Stock</label>
        <input
            type="number"
            name="stock"
            value="{{ product.stock }}"
            min="0"
            required
        >
    </div>

    <div>
        <label>Kategori</label>
        <select name="category" required>
            {% for category in categories %}
                <option
                value="{{ category.id }}"
                {% if category.id == product.category %}selected{% endif %}
                >
                    {{ category.name }}
                </option>
            {% endfor %}
        </select>
    </div>

    <button type="submit">
        Simpan Perubahan
    </button>
</form>
{% endblock %}
